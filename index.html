.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.f{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-size:.95em}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:relative}
header.top::after{content:"";position:absolute;inset:100% 0 auto 0;height:30px;background:var(--bunting) repeat-x;background-size:180px 30px;pointer-events:none;z-index:2}
main{padding-top:40px!important}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.logo{height:64px;width:auto;display:block;filter:brightness(1.45) saturate(1.25) drop-shadow(0 0 5px rgba(255,255,255,.55))}
.brand{flex:1;min-width:200px}
.brand small{color:var(--muted);font-size:13px;letter-spacing:.02em;display:block}
.brand b{font-family:var(--callig);font-size:24px;font-weight:700;line-height:1.3}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.pill strong{font-family:var(--mono);color:var(--ke)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}

main{padding-block:20px 8px;min-height:60vh}
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--teal);color:#fff;font-weight:700}
.btn.alt{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.go{background:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr auto 1fr;gap:18px;align-items:end;padding-block:6px 18px}
.hero-text{background:var(--glass);border-radius:var(--r);padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.08);align-self:center}
.guide-hero{height:clamp(300px,34vw,440px);width:auto;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25));animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.guide-row{display:flex;gap:10px;align-items:flex-end;margin:0 0 16px}
.guide-row .goals{flex:1;margin:0;position:relative;background:var(--glass);border:1px solid var(--line)}
.guide-row .goals::after{content:"";position:absolute;left:-10px;bottom:28px;border:10px solid transparent;border-right-color:var(--glass);border-left:0}
.guide-sm{height:150px;width:auto;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
.chapter-tag{background:var(--glass);border-radius:999px;padding:4px 14px 4px 6px;width:fit-content}
.st-head{background:var(--glass);border-radius:var(--r);padding:12px 16px}
.hero h1{font-family:var(--callig);font-weight:700;font-size:clamp(30px,4.3vw,50px);line-height:1.35}
.hero h1 em{font-style:normal;color:var(--heat)}
.hero p{color:var(--muted);max-width:56ch;margin:10px 0 16px}
.coaster{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0}
.coaster canvas{width:100%;height:auto;display:block;aspect-ratio:16/9}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.bar{font-size:13px}
.bar .t{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar .t i{display:block;height:100%;width:0}
.bar span{display:flex;justify-content:space-between;gap:6px}

/* map */
.chapter-tag{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-family:var(--display);font-size:20px}
.chapter-tag i{font-style:normal;background:var(--teal);color:#fff;border-radius:8px;padding:0 10px;font-size:15px}
.chapter-tag.c5 i{background:var(--heat)}
.track{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.track::before{content:"";position:absolute;inset:50% 4% auto 4%;height:6px;border-top:3px dashed var(--line);border-bottom:3px dashed var(--line);z-index:0}
.stop{position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:right;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .15s}
.stop:hover{transform:translateY(-3px) rotate(-.6deg)}
.stop{border-top:4px solid var(--ke);-webkit-mask:radial-gradient(circle 9px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 9px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.track .stop:nth-child(2n){border-top-color:var(--heat)}.track .stop:nth-child(3n){border-top-color:var(--pe)}
.stop .ride{font-size:12px;color:var(--teal);font-weight:700}
.stop .n{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.stop h3{font-size:17px}
.stop p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.stamp-dot{width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.stop.done .stamp-dot{border:2px solid var(--green);background:var(--green);color:#fff}
.stop .row{display:flex;justify-content:space-between;align-items:center}

/* portrait / landscape */
body.portrait .hero,body.portrait .two{grid-template-columns:1fr}
body.portrait .guide-hero{height:220px;margin:-10px auto 0}
body.portrait .guide-sm{height:110px}
body.portrait .track{grid-template-columns:1fr;padding-right:26px}
body.portrait .track::before{inset:0 8px 0 auto;width:6px;height:auto;border:0;border-right:3px dashed var(--line);border-left:3px dashed var(--line)}
body.portrait .stop::after{content:"";position:absolute;right:-27px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--teal);border:3px solid var(--bg)}
body.portrait .stop.done::after{background:var(--green)}
@media (max-width:760px){.track{grid-template-columns:1fr 1fr}.track::before{display:none}.hero,.two{grid-template-columns:1fr}.guide-hero{height:220px;margin:0 auto}.guide-sm{height:100px}}

/* station view */
.st-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.st-head .eyebrow{font-size:13px;color:var(--muted);letter-spacing:.03em}
.st-head h2{font-family:var(--callig);font-weight:700;font-size:clamp(24px,3.4vw,36px);line-height:1.35;display:flex;align-items:center;gap:10px}
.goals{background:var(--surface-2);border-radius:var(--r);padding:10px 16px;margin:0 0 16px}
.goals b{font-family:var(--display)}
.goals ul{margin:4px 0 0;padding-right:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.two>*{min-width:0}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h3{font-size:18px;margin-bottom:4px}
.card p{margin:4px 0}
.eq{display:block;text-align:center;font-family:var(--mono);direction:ltr;background:var(--surface-2);border-radius:10px;padding:8px;margin:8px 0;font-size:18px}
.lab{background:var(--surface);border:2px solid var(--teal);border-radius:var(--r);padding:14px 16px}
.lab>h3{font-size:18px;display:flex;gap:8px;align-items:center}
.lab>h3::before{content:"لعبة";font-family:var(--body);font-size:12px;background:var(--teal);color:#fff;border-radius:6px;padding:0 8px}
.lab.sim>h3::before{content:"مختبر"}
.lab canvas{width:100%;display:block;border-radius:10px;background:var(--surface-2)}
.ctrl{display:grid;gap:6px;margin:10px 0}
.ctrl label{display:flex;justify-content:space-between;font-size:14px}
input[type=range]{width:100%;accent-color:var(--teal)}
input[type=number],input[type=text],select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:100%}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline>input{flex:1;min-width:120px}
.fb{min-height:1.6em;font-weight:700;margin-top:6px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.choices{display:grid;gap:8px;margin-top:8px}
.choice{text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.choice:hover{border-color:var(--teal)}
.choice.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.choice.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.check{margin-top:18px;background:var(--surface);border:2px dashed var(--green);border-radius:var(--r);padding:14px 16px}
.check>h3{font-size:18px;color:var(--green)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:20px 0;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bin{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:110px;display:flex;flex-direction:column;gap:6px;text-align:right;background:var(--bg)}
.bin b{font-family:var(--display)}
.bin .chip{font-size:13px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:right}
table.t td.num{font-family:var(--mono);direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.match{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.match button{text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.5}
.match button.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
.match button.done{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border-color:var(--ok);opacity:.75;cursor:default}
.match button.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tf{display:grid;gap:10px}
.tf .q{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tf .q span{flex:1;min-width:200px}
.svgbox svg{width:100%;height:auto;display:block}
.cert{background:var(--surface);border:3px double var(--green);border-radius:var(--r);padding:22px;text-align:center}
.cert h2{color:var(--green);font-family:var(--callig);font-weight:700;font-size:clamp(24px,3.6vw,34px)}
.stamps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.stamps i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;border:2px dashed var(--line);color:var(--muted)}
.stamps i.on{background:var(--green);border:2px solid var(--green);color:#fff}
.progress{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}

footer.foot{border-top:1px solid var(--line);background:var(--surface);margin-top:24px}
footer.foot .wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:18px;text-align:center}
.order{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--teal);background:var(--surface-2);color:var(--teal);border-radius:999px;padding:10px 22px;font-weight:700;font-size:17px;transition:transform .15s}
.order:hover{transform:translateY(-2px)}
.order[aria-expanded="true"]{background:var(--teal);color:#fff}
.order-card{display:grid;gap:8px;justify-items:center;padding:14px 22px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);animation:pop .25s}
.order-card .btn{text-decoration:none}
@keyframes pop{from{opacity:.4;transform:scale(.96)}}
footer.foot b{font-family:var(--callig);font-weight:700;font-size:20px}
footer.foot .contact{font-family:var(--mono);direction:ltr;font-size:24px;letter-spacing:.04em;user-select:all;color:var(--teal)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(300%);visibility:hidden;background:var(--green);color:#fff;padding:10px 20px;border-radius:999px;font-weight:700;transition:transform .3s;z-index:20;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:19;width:100%;height:100%}

/* single look: the park photo is the ground, every panel is tinted glass with white text */
html:root:root:root{--bg:rgba(255,255,255,.62);--surface:rgba(255,255,255,.74);--surface-2:rgba(255,255,255,.6);--ink:#15303b;--muted:#3d5a65;--line:rgba(21,48,59,.16);
 --teal:#1879ab;--green:#1d9660;--ke:#d98a00;--pe:#2d5fc4;--heat:#df5426;--ok:#178a52;--bad:#c93434;--glass:rgba(255,255,255,.72);--veil:rgba(0,0,0,0);color-scheme:light}
body{background-color:#cfe6f3}
header.top,.card,.lab,.stop,.st-head,.hero-text,.goals,.check,.coaster,footer.foot,.chapter-tag,.cert,.bin,.ch-card{-webkit-backdrop-filter:blur(7px) saturate(1.2);backdrop-filter:blur(7px) saturate(1.2)}
header.top,footer.foot{background:var(--glass);border-color:var(--line)}
.btn,.chip,.pill strong{text-shadow:none}

input::placeholder{color:#6b8490}
.by{display:inline-block;font-family:var(--callig);font-weight:700;font-size:17px;line-height:1.4;color:#fff;background:var(--heat);border-radius:999px;padding:1px 14px;margin-top:2px}
/* challenge stations */
.stop.ch{border-top-color:var(--ke)!important;background:linear-gradient(160deg,rgba(255,197,61,.28),var(--surface))}
.stop.ch .n{color:var(--ke)}
.ch-card{background:var(--surface);border:2px solid var(--ke);border-radius:var(--r);padding:16px 18px}
.ch-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.hearts{font-size:22px;letter-spacing:2px;color:var(--bad)}
.timer{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:6px 0 12px}
.timer i{display:block;height:100%;background:var(--ke);width:100%;transition:width .2s linear}
.qtype{font-size:12px;background:var(--ke);color:#fff;border-radius:6px;padding:0 8px;text-shadow:none;font-weight:700}
.ch-q{font-size:19px;margin:6px 0 10px}
.stars{font-size:40px;color:var(--ke);letter-spacing:6px}
.ordbox{display:grid;gap:8px}
.ordpick{display:flex;gap:8px;flex-wrap:wrap;min-height:44px;border:2px dashed var(--line);border-radius:10px;padding:6px;margin-top:8px}

/* ---- game feel ---- */
.btn{box-shadow:0 4px 0 rgba(0,0,0,.22);border-radius:14px;transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.22)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.choice{transition:transform .1s}.choice:hover:not(:disabled){transform:scale(1.015)}
.ride{font-size:42px;line-height:1;display:inline-block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
.stop .ride{animation:bob 3.2s ease-in-out infinite}
.stop:nth-child(2n) .ride{animation-delay:-1.1s}.stop:nth-child(3n) .ride{animation-delay:-2s}
.stop:hover .ride{animation:spin .6s}
@keyframes spin{50%{transform:rotate(-12deg) scale(1.2)}}
.st-head h2 .ride{font-size:40px}
.level{background:linear-gradient(90deg,var(--ke),var(--heat));color:#fff;border:0;text-shadow:none}
.level strong{color:#fff!important;font-family:var(--body)}
.lvbar{width:70px;height:6px;border-radius:3px;background:rgba(255,255,255,.45);overflow:hidden;display:inline-block}
.lvbar i{display:block;height:100%;background:#fff}
#buddy{transform:translateY(160%);transition:transform .3s;position:fixed;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:18;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
#buddy img{height:120px;width:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));transition:transform .25s}
#buddy.jump img{animation:jump .5s}
@keyframes jump{30%{transform:translateY(-22px) rotate(-4deg)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
#buddy .say{background:#fff;color:#15303b;border-radius:16px 16px 16px 4px;padding:8px 14px;font-weight:700;max-width:220px;box-shadow:0 6px 16px rgba(0,0,0,.18);margin-bottom:70px;opacity:0;transform:scale(.8);transition:.2s}
#buddy.talk{transform:translateY(0)}
#buddy.talk .say{opacity:1;transform:scale(1)}
#buddy.hide{display:none}
@media (max-width:760px){#buddy img{height:84px}#buddy .say{margin-bottom:50px;max-width:170px;font-size:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.gov{display:flex;flex-direction:column;font-family:var(--body);font-size:12.5px;line-height:1.55;color:var(--ink);font-weight:700;padding-inline-end:14px;border-inline-end:1px solid var(--line)}.brand .by{line-height:1.6;padding-block:4px}@media (max-width:760px){.gov{font-size:11.5px;border:0;padding:0;width:100%;flex-direction:row;flex-wrap:wrap;gap:0 10px}}

header.top .wrap.hd{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px 22px;padding-block:12px 10px}
.hd-id{display:flex;align-items:center;gap:12px;justify-self:start}
.hd .gov{border:0;padding:0;border-inline-start:3px solid var(--teal);padding-inline-start:10px}
.hd .brand{text-align:center;min-width:0;flex:none}
.hd .brand small{font-size:13.5px;font-weight:700;color:var(--teal)}
.hd .brand b{display:block;font-size:32px;line-height:1.25;margin-top:2px}
.people{display:flex;flex-direction:column;gap:6px;justify-self:end}
.people div{display:grid;grid-template-columns:auto auto;align-items:baseline;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-inline-start:4px solid var(--heat);border-radius:12px;padding:5px 14px;min-width:210px;justify-content:space-between}
.people span{font-size:12.5px;color:var(--muted);font-weight:700}
.people b{font-family:var(--callig);font-size:17px;color:var(--ink)}
.hd .tools{grid-column:1/-1;justify-content:center;border-top:1px dashed var(--line);padding-top:9px}
@media (max-width:860px){header.top .wrap.hd{grid-template-columns:1fr;justify-items:center}
 .hd-id,.people{justify-self:center}.hd .gov{width:auto;flex-direction:column;font-size:11.5px}
 .hd .brand b{font-size:26px}.people{flex-direction:row;flex-wrap:wrap;justify-content:center}.people div{grid-template-columns:1fr;text-align:center;gap:0;padding:4px 12px;min-width:140px;justify-content:center}}

.shake{animation:sh .35s}
.bin{min-height:90px}
.bin .chip{white-space:normal;text-align:right}
@media (max-width:560px){.bins{grid-template-columns:1fr!important}}
.ctrl select{margin-top:2px}
.f sub,.eq sub{font-size:.7em}
</style>

</head>

function confetti(){const c=$('#confetti'),x=c.getContext('2d');if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;c.width=innerWidth;c.height=innerHeight;const cols=['#e3342f','#f6993f','#ffed4a','#38c172','#3490dc','#6574cd','#9561e2'];const P=Array.from({length:120},()=>({x:c.width/2,y:c.height*.35,vx:(Math.random()-.5)*12,vy:Math.random()*-12-2,r:Math.random()*6+3,c:cols[Math.random()*7|0],a:Math.random()*6}));let f=0;(function lp(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<110)requestAnimationFrame(lp);else x.clearRect(0,0,c.width,c.height)})()}

let anims=[];function stopAnims(){anims.forEach(a=>a.stop&&a.stop());anims=[]}
let RS=[];let rsT;addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>RS.forEach(f=>{try{f()}catch(e){}}),120)});
function fitCanvas(cv,ratio){const w=cv.clientWidth||600;const dpr=Math.min(devicePixelRatio||1,2);cv.width=w*dpr;cv.height=w*ratio*dpr;const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.direction='ltr';return {x,w,h:w*ratio}}
function loop(fn){let id,run=true;function f(t){if(!run)return;fn(t);id=requestAnimationFrame(f)}id=requestAnimationFrame(f);const a={stop(){run=false;cancelAnimationFrame(id)}};anims.push(a);return a}
function txt(x,s,X,Y,o){o=o||{};x.save();x.font=(o.b?'bold ':'')+(o.s||13)+'px Almarai,Tahoma,sans-serif';x.fillStyle=o.c||css('--ink');x.textAlign=o.a||'center';x.direction=o.rtl?'rtl':'ltr';x.fillText(s,X,Y);x.restore()}
function arrowHead(x,x1,y1,x2,y2,col,sz){const a=Math.atan2(y2-y1,x2-x1);sz=sz||9;x.fillStyle=col;x.beginPath();x.moveTo(x2,y2);x.lineTo(x2-sz*Math.cos(a-.4),y2-sz*Math.sin(a-.4));x.lineTo(x2-sz*Math.cos(a+.4),y2-sz*Math.sin(a+.4));x.closePath();x.fill()}

/* ---------- MCQ helper ---------- */
const fx=t=>/^[\d−\-θ.]/.test(t)?`<span class="f">${t}</span>`:t;
function mcq(el,q,onOK){
  el.innerHTML=`<p>${q.q}</p><div class="choices">${q.c.map((t,i)=>`<button class="choice" data-i="${i}">${fx(t)}</button>`).join('')}</div><div class="fb"></div>`;
  let tried=false;
  el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,fb=el.querySelector('.fb');
    if(i===q.a){b.classList.add('ok');fb.className='fb ok';fb.textContent='إجابة صحيحة. '+(q.why||'');beep(true);el.querySelectorAll('.choice').forEach(x=>x.disabled=true);if(!tried)addScore(100);onOK&&onOK()}
    else{b.classList.add('bad');tried=true;fb.className='fb bad';fb.textContent=q.hint?('حاولي مرة أخرى. تلميح: '+q.hint):'حاولي مرة أخرى.';beep(false)}});

/* ---------- sorting game: tap a card then a bin ---------- */
function sortGame(el,bins,items,onDone){
  const sh=shuffle(items.map((it,i)=>({t:it[0],i})));
  el.innerHTML=`<p style="font-size:14px;color:var(--muted);margin:0">اضغطي على بطاقة ثم على الصندوق المناسب.</p><div class="chips" data-src style="margin-top:6px">${sh.map(o=>`<button class="chip" data-i="${o.i}">${o.t}</button>`).join('')}</div><div class="bins" style="grid-template-columns:repeat(${bins.length},minmax(0,1fr))">${bins.map((b,k)=>`<div class="bin" data-b="${k}" role="button" tabindex="0"><b>${b}</b></div>`).join('')}</div><div class="fb"></div>`;
  let sel=null,done=0;const fb=el.querySelector('.fb');
  el.querySelectorAll('[data-src] .chip').forEach(c=>c.onclick=()=>{el.querySelectorAll('.chip.sel').forEach(x=>x.classList.remove('sel'));sel=c;c.classList.add('sel')});
  el.querySelectorAll('.bin').forEach(bn=>bn.onclick=()=>{if(!sel)return;const it=items[+sel.dataset.i];
    if(it[1]===+bn.dataset.b){sel.classList.remove('sel');sel.classList.add('ok');sel.disabled=true;bn.appendChild(sel);done++;beep(true);addScore(20);fb.className='fb ok';fb.textContent=it[2]||'صحيح!';
      if(done===items.length){fb.textContent='صنّفتِ كل البطاقات! +100'+UNIT;addScore(100);onDone&&onDone()}}
    else{const s=sel;s.classList.add('shake');setTimeout(()=>s.classList.remove('shake','sel'),400);beep(false);fb.className='fb bad';fb.textContent='ليس هذا الصندوق، فكّري مرة أخرى.'}
    sel=null});
}

/* ---------- ordering game ---------- */
function orderGame(el,prompt,items,why,onDone){
  function build(){const sh=shuffle(items.map((t,i)=>[t,i]));
    el.innerHTML=`<p style="margin:0">${prompt}</p><div class="chips" data-src style="margin-top:6px">${sh.map(x=>`<button class="chip" data-i="${x[1]}">${x[0]}</button>`).join('')}</div><div class="ordpick"></div><div class="inline" style="margin-top:6px"><button class="btn alt" data-r>إعادة</button></div><div class="fb"></div>`;
    let seq=[];const dst=el.querySelector('.ordpick'),fb=el.querySelector('.fb');
    el.querySelectorAll('[data-src] .chip').forEach(b=>b.onclick=()=>{seq.push(+b.dataset.i);b.classList.add('sel');b.innerHTML='<b>'+seq.length+'</b> · '+b.innerHTML;b.disabled=true;dst.appendChild(b);
      if(seq.length===items.length){const ok=seq.every((v,i)=>v===i);dst.querySelectorAll('.chip').forEach((c,i)=>c.classList.add(seq[i]===i?'ok':'bad'));beep(ok);
        if(ok){fb.className='fb ok';fb.textContent='ترتيب صحيح! +80'+UNIT+' · '+why;addScore(80);onDone&&onDone()}else{fb.className='fb bad';fb.textContent='الترتيب غير صحيح، اضغطي «إعادة» وحاولي.'}}});
    el.querySelector('[data-r]').onclick=build}
  build();
}

/* ---------- quick calculation game ---------- */
function calcGame(el,gen,onStreak){
  el.innerHTML=`<p data-q></p><div class="inline"><input type="number" step="any" inputmode="decimal" placeholder="الإجابة"><span class="pill" data-u></span><button class="btn" data-c>تحقق</button><button class="btn alt" data-n>سؤال جديد</button></div><div class="fb"></div><p style="font-size:13px;color:var(--muted);margin:4px 0 0">الإجابات الصحيحة المتتالية: <b class="f" data-s>0</b></p>`;
  let cur,streak=0;const inp=el.querySelector('input'),fb=el.querySelector('.fb');
  function nq(){cur=gen();el.querySelector('[data-q]').innerHTML=cur.q;el.querySelector('[data-u]').textContent=cur.u;inp.value='';fb.textContent=''}
  function chk(){const a=parseFloat(inp.value);if(isNaN(a)){fb.className='fb bad';fb.textContent='اكتبي رقمًا أولًا.';return}
    const tol=cur.tol!=null?cur.tol:Math.max(Math.abs(cur.ans)*.03,.05);
    if(Math.abs(a-cur.ans)<=tol){streak++;fb.className='fb ok';fb.textContent='ممتاز! +50'+UNIT+' · '+cur.why;addScore(50);beep(true);if(streak===3&&onStreak)onStreak();setTimeout(nq,1800)}
    else{streak=0;fb.className='fb bad';fb.textContent=cur.hint||'راجعي المعادلة وإشارات الكميات.';beep(false)}
    el.querySelector('[data-s]').textContent=streak}
  el.querySelector('[data-c]').onclick=chk;el.querySelector('[data-n]').onclick=nq;inp.onkeydown=e=>{if(e.key==='Enter')chk()};nq();
}

/* ---------- mirrors & lenses ray-diagram simulator ----------
   kind: cm concave mirror | vm convex mirror | cl convex lens | dl concave lens
   sign convention as in the textbook: 1/f = 1/do + 1/di , m = hi/ho = -di/do */
function optCalc(kind,f0,d){const f=(kind==='vm'||kind==='dl')?-Math.abs(f0):Math.abs(f0);const inf=Math.abs(1/f-1/d)<1e-4;const di=inf?Infinity:1/(1/f-1/d);const m=inf?Infinity:-di/d;return {f,d,di,m,inf,real:!inf&&di>0}}
function optProps(c){if(c.inf)return null;return {t:c.real?'حقيقية':'خيالية',o:c.m<0?'مقلوبة':'معتدلة',s:Math.abs(c.m)>1.02?'مكبرة':Math.abs(c.m)<.98?'مصغرة':'مساوية للجسم'}}
function optics(cv,o,out){
  const st=Object.assign({kind:'cm',f:10,do:30,ho:4},o);
  const mirror=()=>st.kind==='cm'||st.kind==='vm';
  function draw(){
    const {x,w,h}=fitCanvas(cv,.6);x.clearRect(0,0,w,h);
    const R=mirror()?[-64,34]:[-56,66];
    const sx=(w-24)/(R[1]-R[0]),X=u=>12+(u-R[0])*sx,ay=h*.52,sy=(h*.2)/st.ho,Y=v=>ay-v*sy;
    const c=optCalc(st.kind,st.f,st.do);
    x.strokeStyle=css('--muted');x.lineWidth=1;x.setLineDash([6,4]);x.beginPath();x.moveTo(0,ay);x.lineTo(w,ay);x.stroke();x.setLineDash([]);
    const H=(h*.44)/sy;
    // optical element
    x.save();x.lineWidth=4;x.strokeStyle=css('--teal');
    if(mirror()){const k=(st.kind==='cm'?-1:1)*1.6/(H*H);x.beginPath();for(let i=0;i<=40;i++){const v=-H+2*H*i/40,u=k*v*v;i?x.lineTo(X(u),Y(v)):x.moveTo(X(u),Y(v))}x.stroke();
      x.lineWidth=1.5;for(let i=0;i<=14;i++){const v=-H+2*H*i/14,u=k*v*v;x.beginPath();x.moveTo(X(u),Y(v));x.lineTo(X(u)+8,Y(v)-7);x.stroke()}}
    else{const t=1.4,px=X(0),top=Y(H),bot=Y(-H);x.fillStyle='rgba(120,190,235,.45)';x.beginPath();
      const bul=Math.max(9,sx*3.2);if(st.kind==='cl'){x.moveTo(px,top);x.quadraticCurveTo(px+bul*2,ay,px,bot);x.quadraticCurveTo(px-bul*2,ay,px,top)}
      else{const e=bul;x.moveTo(px-e,top);x.lineTo(px+e,top);x.quadraticCurveTo(px-e*.6,ay,px+e,bot);x.lineTo(px-e,bot);x.quadraticCurveTo(px+e*.6,ay,px-e,top)}
      x.closePath();x.fill();x.lineWidth=2;x.stroke()}
    x.restore();
    const mk=(u,lab)=>{if(u<R[0]+1||u>R[1]-1)return;x.fillStyle=css('--ink');x.beginPath();x.arc(X(u),ay,3.5,0,7);x.fill();txt(x,lab,X(u),ay+17,{b:1})};
    if(mirror()){mk(-c.f,'F');mk(-2*c.f,'C')}else{mk(c.f,'F');mk(-c.f,'F');mk(2*c.f,'2F');mk(-2*c.f,'2F')}
    const arrow=(u,v,col,dash,lab)=>{x.save();x.strokeStyle=col;x.lineWidth=4;if(dash)x.setLineDash([5,4]);x.beginPath();x.moveTo(X(u),ay);x.lineTo(X(u),Y(v)+(v>0?6:-6));x.stroke();x.setLineDash([]);arrowHead(x,X(u),ay,X(u),Y(v),col,11);x.restore();txt(x,lab,X(u),v>0?ay+32:ay-10,{s:12,c:col,b:1,rtl:1})};
    // rays
    x.save();x.beginPath();x.rect(0,0,w,h);x.clip();
    const O=[-st.do,st.ho],xi=c.inf?0:(mirror()?-c.di:c.di),I=[xi,c.inf?0:c.m*st.ho];
    const P=[[0,st.ho,'--heat'],[0,0,'--pe']];
    if(!c.inf){const y2=st.ho*c.f/(c.f-st.do);if(Math.abs(y2)<H*1.6)P.push([0,y2,'--ke'])}
    const L=(a,b)=>{x.beginPath();x.moveTo(X(a[0]),Y(a[1]));x.lineTo(X(b[0]),Y(b[1]));x.stroke()};
    P.forEach(p=>{const col=css(p[2]);x.strokeStyle=col;x.lineWidth=2;L(O,p);
      const mid=[(O[0]+p[0])/2,(O[1]+p[1])/2];arrowHead(x,X(O[0]),Y(O[1]),X(mid[0]),Y(mid[1]),col,8);
      let d;if(c.inf)d=mirror()?[-st.do,-st.ho]:[st.do,-st.ho];else d=c.real?[I[0]-p[0],I[1]-p[1]]:[p[0]-I[0],p[1]-I[1]];
      const n=Math.hypot(d[0]*sx,d[1]*sy)||1,far=[p[0]+d[0]/n*3000,p[1]+d[1]/n*3000];L(p,far);
      const q=[p[0]+d[0]/n*90,p[1]+d[1]/n*90];arrowHead(x,X(p[0]),Y(p[1]),X(q[0]),Y(q[1]),col,8);
      if(!c.inf&&!c.real){x.setLineDash([5,4]);x.globalAlpha=.75;L(p,I);x.setLineDash([]);x.globalAlpha=1}});
    x.restore();
    arrow(-st.do,st.ho,css('--green'),false,'الجسم');
    if(!c.inf)arrow(xi,c.m*st.ho,css('--heat'),!c.real,c.real?'صورة حقيقية':'صورة خيالية');
    if(!c.inf&&(xi<R[0]||xi>R[1]))txt(x,'الصورة خارج حدود الرسم',w/2,18,{c:css('--bad'),b:1,rtl:1});
    if(out){const p=optProps(c);out.innerHTML=c.inf?`<b>الجسم في البؤرة:</b> الأشعة ${mirror()?'المنعكسة':'المنكسرة'} متوازية فلا تتكون صورة (تتكون في اللانهاية).`:
      `<span class="f" dir="ltr" style="white-space:normal">d<sub>o</sub> = ${fmt(st.do,1)} cm · f = ${fmt(c.f,1)} cm · d<sub>i</sub> = ${fmt(c.di,1)} cm · m = ${fmt(c.m,2)}</span><br>الصورة: <b>${p.t}</b> · <b>${p.o}</b> · <b>${p.s}</b>`}
    return c}
  RS.push(draw);draw();
  return {set(v){Object.assign(st,v);return draw()},get:()=>st,calc:()=>optCalc(st.kind,st.f,st.do)};
}
function optSliders(id,o){return `<div class="ctrl"><label for="${id}d">بُعد الجسم <span class="f" data-v="${id}d">${o.do} cm</span></label><input type="range" id="${id}d" min="${o.dmin||3}" max="${o.dmax||55}" step="0.5" value="${o.do}">
<label for="${id}f">البعد البؤري (القيمة المطلقة) <span class="f" data-v="${id}f">${o.f} cm</span></label><input type="range" id="${id}f" min="6" max="16" step="0.5" value="${o.f}"></div>`}
function bindSliders(id,sim){['d','f'].forEach(k=>{const el=$('#'+id+k);el.oninput=()=>{document.querySelector(`[data-v="${id}${k}"]`).textContent=el.value+' cm';sim.set(k==='d'?{do:+el.value}:{f:+el.value})}})}
function setSlider(id,v){const el=$('#'+id+'d');el.value=v;document.querySelector(`[data-v="${id}d"]`).textContent=v+' cm'}

/* ---------- predict-the-image game ---------- */
function predictGame(el,sim,sid,rounds,onDone){
  let r=0,ans={};
  const G=[['t','النوع',['حقيقية','خيالية']],['o','الاتجاه',['مقلوبة','معتدلة']],['s','الحجم',['مكبرة','مصغرة','مساوية للجسم']]];
  function show(){if(r>=rounds.length){el.innerHTML=`<p class="fb ok">أنهيتِ كل الجولات! +150${UNIT}</p><button class="btn alt" data-again>العبي مرة أخرى</button>`;addScore(150);el.querySelector('[data-again]').onclick=()=>{r=0;show()};onDone&&onDone();return}
    const R=rounds[r];ans={};
    el.innerHTML=`<p style="margin:0"><span class="pill">جولة <strong>${r+1}/${rounds.length}</strong></span> ${R.label}</p>${G.map(g=>`<div class="inline" style="margin-top:8px"><b style="min-width:64px">${g[1]}:</b><div class="chips" data-g="${g[0]}">${g[2].map(v=>`<button class="chip">${v}</button>`).join('')}</div></div>`).join('')}<div class="inline" style="margin-top:10px"><button class="btn" data-chk>تحقق ثم أظهري الرسم</button></div><div class="fb"></div>`;
    el.querySelectorAll('[data-g]').forEach(g=>g.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{g.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');ans[g.dataset.g]=b.textContent}));
    el.querySelector('[data-chk]').onclick=()=>{const fb=el.querySelector('.fb');if(Object.keys(ans).length<3){fb.className='fb bad';fb.textContent='اختاري النوع والاتجاه والحجم أولًا.';return}
      const s=sim.get(),dd=R.k!=null?Math.round(R.k*s.f*2)/2:R.do,c=optCalc(s.kind,s.f,dd),p=optProps(c);const ok=p.t===ans.t&&p.o===ans.o&&p.s===ans.s;
      setSlider(sid,dd);sim.set({do:dd});beep(ok);
      if(ok){fb.className='fb ok';fb.textContent=`صحيح! الصورة ${p.t} ${p.o} ${p.s}. +60${UNIT}`;addScore(60);r++;const nx=document.createElement('button');nx.className='btn go';nx.textContent='الجولة التالية';nx.onclick=show;fb.after(nx)}
      else{fb.className='fb bad';fb.textContent=`انظري إلى الرسم: الصورة ${p.t} ${p.o} ${p.s}. حاولي حفظ القاعدة ثم اختاري من جديد.`}}}
  show();
}

const S=[
 {id:'s1',e:'✏️',sec:'تجربة استهلالية · ص 173',t:'كشك القلم المكسور',d:'لماذا يبدو القلم مكسورًا داخل السائل؟'},

const medSel=(id,def)=>`<select id="${id}">${MED.map((m,i)=>`<option value="${i}" ${i===def?'selected':''}>${m[0]} (n = ${m[1]})</option>`).join('')}</select>`;
const N=v=>{const n=Math.hypot(v.x,v.y);return {x:v.x/n,y:v.y/n}};
function refr(d,Nn,eta){const ci=-(d.x*Nn.x+d.y*Nn.y);const k=1-eta*eta*(1-ci*ci);if(k<0)return null;const a=eta*ci-Math.sqrt(k);return N({x:eta*d.x+a*Nn.x,y:eta*d.y+a*Nn.y})}
const COLS=[['#ff3b30',1.50,'أحمر'],['#ff9500',1.515,'برتقالي'],['#ffd60a',1.53,'أصفر'],['#34c759',1.545,'أخضر'],['#0a84ff',1.56,'أزرق'],['#af52de',1.58,'بنفسجي']];
function prism(x,w,h,incDeg,dark){
  const s=Math.min(w*.42,h*1.0),hg=s*.866,cx=w*.5,cy=h*.56,A={x:cx,y:cy-hg*.55},B={x:cx-s/2,y:cy+hg*.45},C={x:cx+s/2,y:cy+hg*.45};
  x.fillStyle=dark?'rgba(160,220,255,.22)':'rgba(120,190,235,.35)';x.strokeStyle=dark?'#bfe9ff':css('--teal');x.lineWidth=2;x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.lineTo(C.x,C.y);x.closePath();x.fill();x.stroke();
  const E={x:A.x+.56*(B.x-A.x),y:A.y+.56*(B.y-A.y)},d0={x:Math.cos(incDeg*D2R),y:Math.sin(incDeg*D2R)};
  const nl=N({x:-(B.y-A.y),y:(B.x-A.x)}),Nl=nl.x>0?{x:-nl.x,y:-nl.y}:nl;const nr=N({x:(C.y-A.y),y:-(C.x-A.x)}),No=nr.x<0?{x:-nr.x,y:-nr.y}:nr;
  x.strokeStyle='#fff';x.lineWidth=4;x.shadowColor='#fff';x.shadowBlur=dark?10:3;x.beginPath();x.moveTo(E.x-d0.x*600,E.y-d0.y*600);x.lineTo(E.x,E.y);x.stroke();x.shadowBlur=0;
  if(!dark){x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=1;x.beginPath();x.moveTo(E.x-d0.x*600,E.y-d0.y*600);x.lineTo(E.x,E.y);x.stroke()}
  x.globalCompositeOperation=dark?'lighter':'source-over';
  COLS.forEach(([col,n])=>{const t1=refr(d0,Nl,1/n);if(!t1)return;const ux=C.x-A.x,uy=C.y-A.y,den=t1.x*uy-t1.y*ux;if(Math.abs(den)<1e-9)return;const t=((A.x-E.x)*uy-(A.y-E.y)*ux)/den;const X2={x:E.x+t1.x*t,y:E.y+t1.y*t};
    x.strokeStyle=col;x.globalAlpha=.75;x.lineWidth=2;x.beginPath();x.moveTo(E.x,E.y);x.lineTo(X2.x,X2.y);x.stroke();
    const t2=refr(t1,{x:-No.x,y:-No.y},n);x.globalAlpha=1;if(!t2)return;x.lineWidth=3;x.beginPath();x.moveTo(X2.x,X2.y);x.lineTo(X2.x+t2.x*900,X2.y+t2.y*900);x.stroke()});
  x.globalCompositeOperation='source-over';x.globalAlpha=1;
}

  const cv=$('#sc');

  const cv=$('#rc');let t0=null;
  function draw(t){const {x,w,h}=fitCanvas.r||(fitCanvas.r=fitCanvas(cv,.5));x.clearRect(0,0,w,h);const lh=h/lanes.length,x0=12,x1=w-110;
    lanes.forEach((k,i)=>{const m=MED[k],y=i*lh;x.fillStyle=i%2?'rgba(120,190,235,.18)':'rgba(120,190,235,.32)';x.fillRect(0,y,w,lh);
      txt(x,m[0],w-56,y+lh/2-2,{b:1,rtl:1,s:13});txt(x,'v = '+(3/m[1]).toFixed(2)+'×10⁸ m/s',w-56,y+lh/2+15,{s:11,c:css('--muted')});

  const P=a=>a[Math.random()*a.length|0];

    if(Math.random()<.6)return {q:`ما سرعة الضوء في ${m[0]} <span class="f">(n = ${m[1]})</span>؟ اكتبي الناتج بوحدة <span class="f">×10⁸ m/s</span>.`,ans:+(3/m[1]).toFixed(2),u:'×10⁸ m/s',tol:.02,why:`v = c/n = 3.00×10⁸ / ${m[1]} = ${(3/m[1]).toFixed(2)}×10⁸ m/s`};

s4(){

  <div class="goals"><b>ماذا سأتعلم؟</b><ul><li>أحسب الزاوية الحرجة لحد فاصل بين وسطين.</li><li>أوضح كيف تنقل الألياف البصرية الضوء.</li></ul></div>
  <div class="two">

    <div class="card"><h3>الانعكاس الكلي الداخلي</h3><p>يحدث عندما ينتقل الضوء من وسط معامل انكساره <b>كبير</b> إلى وسط معامل انكساره <b>أقل</b>، بزاوية سقوط <b>أكبر من الزاوية الحرجة</b>؛ فينعكس الضوء كاملًا داخل الوسط الأول.</p></div>

   </div>
   <div class="cards">

     <p class="fb" id="ffb"></p></div>

  const cv=$('#fc');let won=false;
  function draw(){const {x,w,h}=fitCanvas(cv,.5);x.clearRect(0,0,w,h);const n=+$('#fm').value,th=+$('#fa').value,tc=Math.asin(1/n)*R2D,top=h*.3,bot=h*.7;

    const al=(90-th)*D2R;let p={x:0,y:(top+bot)/2},dy=-1,I=1;x.lineWidth=3;
    for(let k=0;k<40&&p.x<w;k++){const ty=dy<0?top:bot,dx=Math.abs(ty-p.y)/Math.tan(al);const q={x:p.x+dx,y:ty};x.strokeStyle=`rgba(255,45,85,${I})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();

  ['fm','fa'].forEach(i=>$('#'+i).oninput=draw);RS.push(draw);draw();

  calcGame($('#cg'),()=>{const pairs=[['الماء',1.33,'الهواء',1.00],['زجاج العدسات',1.52,'الهواء',1.00],['الكوارتز',1.54,'الهواء',1.00],['الألماس',2.42,'الهواء',1.00],['زجاج العدسات',1.52,'الماء',1.33],['الألماس',2.42,'الماء',1.33],['الزجاج الصوّاني',1.62,'الهواء',1.00]];const m=P(pairs);const a=Math.asin(m[3]/m[1])*R2D;

},

   <div class="lab"><h3>المسابقة الشاملة</h3><div class="progress"><i id="qp"></i></div><div id="qz"></div></div>

  ${navBtns(id)}`;
  $('#mt').innerHTML=shuffle(pairs.map((p,i)=>`<button data-i="${i}" data-s="t">${p[0]}</button>`)).join('');
  $('#md').innerHTML=shuffle(pairs.map((p,i)=>`<button data-i="${i}" data-s="d">${p[1]}</button>`)).join('');
  let pk=null,matched=0,quizDone=false,qScore=0;const need=Math.ceil(quiz.length*.7);
  document.querySelectorAll('.match button').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;

    if(pk.dataset.i===b.dataset.i){[pk,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done')});matched++;addScore(25);beep(true);if(matched===pairs.length){$('#mf').className='fb ok';$('#mf').textContent='طابقتِ كل المفردات! +200'+UNIT;addScore(200);maybeCert()}}
    else{[pk,b].forEach(x=>{x.classList.add('shake');setTimeout(()=>x.classList.remove('shake','sel'),400)});beep(false)}pk=null});
  let qi=0;function showQ(){$('#qp').style.width=(qi/quiz.length*100)+'%';if(qi>=quiz.length){quizDone=true;$('#qz').innerHTML=`<p style="font-family:var(--display);font-size:22px">نتيجتك: ${qScore} من ${quiz.length}</p><button class="btn alt" id="rq">إعادة المسابقة</button>`;$('#rq').onclick=()=>{qi=0;qScore=0;showQ()};maybeCert();return}
    const q=quiz[qi];$('#qz').innerHTML=`<p class="eyebrow" style="color:var(--muted);font-size:13px">السؤال ${qi+1} من ${quiz.length}</p><p>${q.q}</p><div class="choices">${q.c.map((t,i)=>`<button class="choice" data-i="${i}">${fx(t)}</button>`).join('')}</div>`;
    document.querySelectorAll('#qz .choice').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===q.a;b.classList.add(ok?'ok':'bad');if(!ok)document.querySelectorAll('#qz .choice')[q.a].classList.add('ok');document.querySelectorAll('#qz .choice').forEach(x=>x.disabled=true);beep(ok);if(ok){qScore++;addScore(50)}setTimeout(()=>{qi++;showQ()},900)})}
  showQ();
  function maybeCert(){if(!(quizDone&&matched===pairs.length))return;if(qScore>=need)stamp(id);const n=Object.keys(state.stamps).length;
    $('#certBox').innerHTML=`<div class="cert"><img src="${GUIDE}" alt="" style="height:140px;width:auto;float:left;margin-inline-end:8px"><p style="color:var(--muted);margin:0">${CFG.gov}</p><p style="color:var(--muted);margin:0">${CFG.subj}</p><h2>${certTitle}</h2>
     <div class="inline" style="justify-content:center;margin:10px 0"><label for="sn">اسم الطالبة:</label><input type="text" id="sn" style="max-width:260px" placeholder="اكتبي اسمك"></div>
     <p id="snOut" style="font-family:var(--callig);font-weight:700;font-size:28px;margin:4px 0;color:var(--teal)">—</p>
     <p>أتمّت الرحلة عبر ${chText}، وجمعت <b>${n}</b> من ${CFG.N} ختمًا، ورصيد ضوء <b class="f">${state.score.toLocaleString('en-US')}${UNIT}</b>، ونتيجة المسابقة <b>${qScore}/${quiz.length}</b>.</p>
     <div class="stamps">${ORDER.map((sid,i)=>`<i class="${state.stamps[sid]?'on':''}">${i+1}</i>`).join('')}</div>
     ${qScore<need?`<p style="color:var(--bad)">تحتاجين ${need} إجابات صحيحة على الأقل لختم المحطة الأخيرة. أعيدي المسابقة.</p>`:''}
     <div class="inline" style="justify-content:space-between;margin-top:8px"><p style="margin:0">${CFG.teacher}</p><p style="margin:0">${CFG.principal}</p></div></div>`;
    $('#sn').value=store.get('name','');$('#snOut').textContent=$('#sn').value||'—';$('#sn').oninput=e=>{store.set('name',e.target.value);$('#snOut').textContent=e.target.value||'—'}}
}

/* ---------- shared station chrome ---------- */
function byId(id){return S.find(s=>s.id===id)}
function head(i){const s=S[i];return `<div class="st-head"><div><div class="eyebrow">${s.c?'محطة التحدي':'اللعبة'} ${ORDER.indexOf(s.id)+1} من ${ORDER.length} · ${s.sec.replace(/(\d+-\d+)/g,'<bdi dir="ltr">$1</bdi>')}</div><h2><span class="ride" aria-hidden="true">${s.e}</span>${s.t}</h2></div><button class="btn alt" data-go="map">خريطة مدينة الألعاب</button></div>`}
function nav(i){return `<div class="check" id="chk"><h3>نقطة التفتيش: أجيبي لتحصلي على ختم المحطة</h3><div id="chkq"></div></div>${navBtns(S[i].id)}`}
function navBtns(id){const k=ORDER.indexOf(id),p=ORDER[k-1],n=ORDER[k+1];return `<div class="nav">${p?`<button class="btn alt" data-go="${p}">السابق: ${byId(p).t}</button>`:'<span></span>'}${n?`<button class="btn go" data-go="${n}">التالي: ${byId(n).t}</button>`:''}</div>`}
function checkpoint(i,q){mcq($('#chkq'),q,()=>stamp(S[i].id))}
function stopCard(s){return `<button class="stop ${s.c?'ch':''} ${state.stamps[s.id]?'done':''}" data-go="${s.id}"><div class="row"><span class="n">${s.c?'تحدي':'تذكرة'} ${ORDER.indexOf(s.id)+1}</span><span class="stamp-dot">${state.stamps[s.id]?'تم':ORDER.indexOf(s.id)+1}</span></div><span class="ride" aria-hidden="true">${s.e}</span><h3>${s.t}</h3><p>${s.d}</p></button>`}
function heroBlock(h1,p,canvasLabel,caption){const n=Object.keys(state.stamps).length;return `<section class="hero">
    <div class="hero-text"><p style="margin:0;color:var(--teal);font-weight:700">أنا مرشدتك في مدينة ألعاب الضوء… هيا نبدأ!</p><h1>${h1}</h1><p>${p}</p>
    <div class="inline"><button class="btn go" data-go="${ORDER.find(id=>!state.stamps[id])||ORDER[0]}">${n?'أكملي الرحلة':'ابدئي الرحلة'}</button><button class="btn alt" id="reset">رحلة جديدة</button></div>
    <div class="progress" aria-hidden="true"><i style="width:${n*100/CFG.N}%"></i></div></div>
    <img class="guide-hero" src="${GUIDE}" alt="مرشدة الرحلة ترحب بك">
    <div class="coaster"><canvas id="hc" aria-label="${canvasLabel}"></canvas><p id="hcap" style="margin:6px 0 0;font-size:13px;color:var(--muted)">${caption}</p></div>
  </section>`}
function bindReset(){$('#reset').onclick=()=>{const b=$('#reset');if(b.dataset.c){state={stamps:{},score:0};save();render()}else{b.dataset.c=1;b.textContent='اضغطي مرة أخرى للتأكيد'}}}

/* ---------- challenge stations ---------- */
const TL={mcq:'اختيار من متعدد',num:'مسألة حسابية',tf:'صح أم خطأ',ord:'رتّبي'};
function challenge(id){
  const s=byId(id),Q=CH[id],TIME=40;
  $('#app').innerHTML=head(S.indexOf(s))+`<div class="goals"><b>قواعد التحدي</b><ul><li>${INTRO[id]}</li><li>لديك 3 قلوب، و${TIME} ثانية لكل سؤال. الإجابة الخاطئة أو انتهاء الوقت يُفقدك قلبًا.</li><li>الإجابة الأسرع تمنحك ضوءًا أكثر. اجتازي 4 أسئلة على الأقل لتحصلي على الختم.</li></ul></div>
  <div class="ch-card" id="chc"><div style="text-align:center"><p class="stars">★ ★ ★</p><button class="btn go" id="startCh" style="font-size:20px;padding:12px 30px">ابدئي التحدي</button></div></div>`+navBtns(id);
  let qi,hearts,right,tmr=null,left,locked;
  anims.push({stop(){clearInterval(tmr)}});
  function start(){qi=0;hearts=3;right=0;show()}
  function bar(){return `<div class="ch-top"><span class="pill">السؤال <strong>${qi+1}/${Q.length}</strong></span><span class="hearts" aria-label="القلوب ${hearts}">${'♥'.repeat(hearts)}<span style="opacity:.3">${'♥'.repeat(3-hearts)}</span></span><span class="pill">الوقت <strong id="tl">${TIME}</strong></span></div><div class="timer"><i id="tb"></i></div>`}
  function tick(){left=TIME;locked=false;clearInterval(tmr);tmr=setInterval(()=>{left-=.2;const tb=$('#tb'),tl=$('#tl');if(!tb){clearInterval(tmr);return}tb.style.width=Math.max(0,left/TIME*100)+'%';tl.textContent=Math.ceil(Math.max(0,left));if(left<=0){clearInterval(tmr);judge(false,'انتهى الوقت!')}},200)}
  function judge(ok,msg){if(locked)return;locked=true;clearInterval(tmr);const q=Q[qi],fb=$('#chfb');beep(ok);
    if(ok){right++;const pts=60+Math.round(left/TIME*90);addScore(pts);fb.className='fb ok';fb.textContent=`أحسنتِ! +${pts}${UNIT} · ${q.why}`}else{hearts--;fb.className='fb bad';fb.textContent=(msg||'إجابة غير صحيحة.')+' '+q.why}
    $('#chc').querySelectorAll('button.choice,button.chip,#numgo').forEach(b=>b.disabled=true);
    const nx=document.createElement('button');nx.className='btn';nx.style.marginTop='10px';nx.textContent=hearts<=0||qi===Q.length-1?'النتيجة':'السؤال التالي';nx.onclick=()=>{qi++;(hearts<=0||qi>=Q.length)?end():show()};fb.after(nx);nx.focus()}
  function show(){const q=Q[qi];let body='';
    if(q.t==='mcq')body=`<div class="choices">${q.c.map((t,i)=>`<button class="choice" data-i="${i}">${fx(t)}</button>`).join('')}</div>`;
    if(q.t==='tf')body=`<div class="inline"><button class="btn go choice" data-v="1" style="flex:1">صح</button><button class="btn choice" data-v="0" style="flex:1;background:var(--heat)">خطأ</button></div>`;
    if(q.t==='num')body=`<div class="inline"><input type="number" id="numin" inputmode="decimal" step="any" placeholder="الإجابة"><span class="pill">${q.u}</span><button class="btn" id="numgo">تحقق</button></div>`;
    if(q.t==='ord'){const sh=shuffle(q.items.map((t,i)=>[t,i]));body=`<p style="font-size:14px;color:var(--muted)">اضغطي على البطاقات بالترتيب الصحيح.</p><div class="chips" id="ordsrc">${sh.map(x=>`<button class="chip" data-i="${x[1]}">${x[0]}</button>`).join('')}</div><div class="ordpick" id="orddst"></div><div class="inline" style="margin-top:6px"><button class="btn alt" id="ordreset">إعادة الترتيب</button></div>`}
    $('#chc').innerHTML=bar()+`<span class="qtype">${TL[q.t]}</span><p class="ch-q">${q.q}</p>${body}<div class="fb" id="chfb"></div>`;
    if(q.t==='mcq')$('#chc').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===q.a;b.classList.add(ok?'ok':'bad');if(!ok)$('#chc').querySelectorAll('.choice')[q.a].classList.add('ok');judge(ok)});
    if(q.t==='tf')$('#chc').querySelectorAll('.choice').forEach(b=>b.onclick=()=>judge((b.dataset.v==='1')===q.a));
    if(q.t==='num'){const go=()=>{const v=parseFloat($('#numin').value);if(isNaN(v)){$('#chfb').className='fb bad';$('#chfb').textContent='اكتبي رقمًا أولًا.';return}judge(Math.abs(v-q.ans)<=q.tol,`الإجابة الصحيحة ${q.ans} ${q.u}.`)};$('#numgo').onclick=go;$('#numin').onkeydown=e=>{if(e.key==='Enter')go()};$('#numin').focus()}
    if(q.t==='ord'){let seq=[];const src=$('#ordsrc'),dst=$('#orddst');
      src.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(locked)return;seq.push(+b.dataset.i);b.classList.add('sel');b.innerHTML='<b>'+seq.length+'</b> · '+b.innerHTML;b.disabled=true;dst.appendChild(b);
        if(seq.length===q.items.length){const ok=seq.every((v,i)=>v===i);dst.querySelectorAll('.chip').forEach((c,i)=>c.classList.add(seq[i]===i?'ok':'bad'));judge(ok,'الترتيب الصحيح: '+q.items.join(' ← ')+'.')}});
      $('#ordreset').onclick=()=>{if(!locked)show()}}
    tick()}
  function end(){clearInterval(tmr);const pass=right>=4&&hearts>0,st=hearts>0?(right===Q.length?3:right>=5?2:right>=4?1:0):0;
    if(pass)stamp(id);
    $('#chc').innerHTML=`<div style="text-align:center"><p class="stars">${'★'.repeat(st)}<span style="opacity:.3">${'★'.repeat(3-st)}</span></p><h3 style="font-size:24px">${pass?'اجتزتِ التحدي!':(hearts<=0?'نفدت القلوب':'لم تكتمل الأسئلة المطلوبة')}</h3><p>الإجابات الصحيحة: <b>${right}</b> من ${Q.length}${pass?' · حصلتِ على ختم محطة التحدي':' · تحتاجين 4 إجابات صحيحة دون أن تنفد القلوب'}</p><div class="inline" style="justify-content:center"><button class="btn alt" id="again">أعيدي التحدي</button>${pass&&ORDER[ORDER.indexOf(id)+1]?`<button class="btn go" data-go="${ORDER[ORDER.indexOf(id)+1]}">تابعي الرحلة</button>`:''}</div></div>`;
    $('#again').onclick=start}
  $('#startCh').onclick=start;
}
Object.keys(CH).forEach(id=>views[id]=()=>challenge(id));

function render(){stopAnims();RS=[];const id=(location.hash||'#map').slice(1);(views[id]||views.map)();const gl=document.querySelector('.goals');if(gl){const w=document.createElement('div');w.className='guide-row';gl.before(w);w.append(gl);w.insertAdjacentHTML('beforeend','<img class="guide-sm" src="'+GUIDE+'" alt="المرشدة">')}window.scrollTo(0,0);save();const bd=$('#buddy');bd.classList.toggle('hide',id==='map'||!views[id]);if(id!=='map'&&views[id]){const st=byId(id);setTimeout(()=>say(st&&st.c?'تحدي! ركّزي وانتبهي للوقت':'أهلًا في '+(st?st.t:'اللعبة')+'! جاهزة؟',2400),400)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){e.preventDefault();const id=b.dataset.go;if(('#'+id)===location.hash||(id==='map'&&!location.hash))render();else location.hash=id}});
addEventListener('hashchange',render);
render();
})();

</script>

</body>
</html>
